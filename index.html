
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Gold</title>
<style>
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#181818;border-bottom:2px solid #e62117}
h1{margin:0 0 14px;font-size:25px}
h1 span{color:#e62117}
input,button{padding:12px;border-radius:8px;border:0;font-size:16px}
input{width:65%;background:#303030;color:white}
button{background:#e62117;color:white;cursor:pointer}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#202020;border-radius:10px;overflow:hidden;color:white;text-decoration:none}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#333}
.card h3{font-size:16px;padding:0 12px}
.card p{font-size:13px;color:#bbb;padding:0 12px 10px}
#player{display:none;margin:16px 0}
iframe{width:100%;aspect-ratio:16/9;border:0}
</style>
</head>
<body>
<header>
<h1>▶ YouTube <span>Gold</span></h1>
<form id="search">
<input id="q" placeholder="Pesquisar vídeos..." aria-label="Pesquisar">
<button>Buscar</button>
</form>
</header>
<main>
<h2>Recomendados</h2>
<div id="player"></div>
<div class="grid" id="videos"></div>
</main>
<script>
const list=[
["Música brasileira","playlist?list=PL"],
["Gameplay PS4","videoseries?list=PL"],
["Humor brasileiro","results?search_query=videos+engracados"],
["Tecnologia","results?search_query=tecnologia"],
["Tutoriais","results?search_query=tutoriais"],
["Futebol","results?search_query=melhores+momentos+futebol"]
];
const grid=document.getElementById("videos");
list.forEach((v,i)=>{
const query=v[0];
const a=document.createElement("a");
a.className="card";
a.href="https://www.youtube.com/results?search_query="+encodeURIComponent(query);
a.innerHTML='<img src="https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg" alt=""><h3></h3><p>Selecionar para procurar vídeos</p>';
a.querySelector("h3").textContent=query;
a.addEventListener("click",e=>{
e.preventDefault();
document.getElementById("player").style.display="block";
document.getElementById("player").innerHTML='<iframe src="https://www.youtube.com/embed/aqz-KE-bpKQ" allowfullscreen></iframe>';
});
grid.appendChild(a);
});
document.getElementById("search").addEventListener("submit",e=>{
e.preventDefault();
const q=document.getElementById("q").value.trim();
if(q)location.href="https://www.youtube.com/results?search_query="+encodeURIComponent(q);
});
</script>
</body>
</html>
